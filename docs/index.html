lace. Huge volume but brutal competition for newcomers. Winnable with a sharp niche and patient bidding.", "setup_steps": ["Create a SPECIALIZED profile — title it ‘Computer Vision & ML Engineer’, NOT ‘Data Scientist’ (niche wins over broad).", "Write a profile overview leading with TactiVision’s 85.7% result and your e& experience.", "Start by bidding on small, specific CV/ML jobs (object detection, data pipelines, model fine-tuning) — build reviews before chasing big contracts.", "Write custom proposals (use the builder pitch), never copy-paste. Apply to fresh postings fast (<24h old)."], "pitch_angle": "Niche down hard. ‘I build object-detection pipelines’ gets hired; ‘I do data science’ gets ignored.", "priority_note": "Don’t lead here — slow and saturated. Run it in parallel once Tier 1 is set up."}, {"name": "Toptal", "tier": "Tier 3 (later)", "url": "https://toptal.com", "pays_usd": true, "egypt_eligible": "yes", "effort": "Very High — hard screening", "time_to_first_dollar": "1-2 months", "what_it_is": "Elite freelance network (‘top 3%’). Pays the best rates but the screening is genuinely hard (English interview, live technical, test project).", "setup_steps": ["Not yet — come back after you have 2-3 contract reviews from Tier 1 platforms.", "When ready: apply, pass the English + personality screen, then a timed algorithm interview, then a test project.", "Prepare heavily for the technical interview (data structures, algorithms, ML system design)."], "pitch_angle": "Needs demonstrated track record. Build it elsewhere first, then Toptal’s rates make it worth the hard screen.", "priority_note": "ASPIRATIONAL. Don’t attempt cold — a rejection locks you out for months. Earn reviews first."}];
const BOARDS = [{"name": "Wuzzuf", "region": "Egypt", "url": "https://wuzzuf.net/search/jobs/?q=data%20scientist%20OR%20machine%20learning%20OR%20data%20analyst&filters%5Bpost_date%5D%5B0%5D=within_2_weeks", "what_it_is": "Egypt's largest job board — the primary source for Cairo-based data/ML roles and internships.", "search_tip": "Also search 'AI engineer', 'junior data', and set experience to Entry/Junior. Fresh roles daily.", "priority": "high"}, {"name": "Forasna", "region": "Egypt", "url": "https://forasna.com/جوبز-فى-مصر/data", "what_it_is": "Egypt board with strong entry-level and fresh-grad coverage.", "search_tip": "Good for internships and junior roles that don't appear on English boards.", "priority": "medium"}, {"name": "Bayt", "region": "MENA/Gulf", "url": "https://www.bayt.com/en/international/jobs/data-scientist-jobs/", "what_it_is": "The largest Gulf/MENA job board — UAE, Saudi, Egypt roles including remote.", "search_tip": "Filter by UAE and Saudi, and by Entry Level. Search 'machine learning' and 'data analyst' separately.", "priority": "high"}, {"name": "GulfTalent", "region": "Gulf", "url": "https://www.gulftalent.com/jobs/data-scientist", "what_it_is": "Premium Gulf-focused board — UAE/Saudi professional and tech roles.", "search_tip": "Strong for Dubai/Riyadh. Check for remote and relocation-sponsored roles.", "priority": "high"}, {"name": "LinkedIn Jobs", "region": "Global/MENA", "url": "https://www.linkedin.com/jobs/search/?keywords=machine%20learning%20engineer&location=Egypt&f_TPR=r604800&f_E=1%2C2", "what_it_is": "LinkedIn filtered to entry/associate data-ML roles relevant to Egypt, posted last 7 days.", "search_tip": "Change location to 'United Arab Emirates' or 'Saudi Arabia', and toggle Remote. Set up a saved search + alert here — highest-value single action.", "priority": "high"}, {"name": "Wellfound", "region": "Global", "url": "https://wellfound.com/role/r/data-scientist", "what_it_is": "Startup jobs, many remote and open to international applicants.", "search_tip": "Filter for Remote and check 'open to international'. Good for contract-to-hire.", "priority": "medium"}];
let activeTrack = 'remote';
let searchTerm = '';
let sortMode = 'score';

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function updateTabCounts() {
  var remote = JOBS.filter(j => j.work_mode === 'remote').length;
  var reloc = JOBS.filter(j => j.work_mode === 'onsite').length;
  document.getElementById('count-remote').textContent = remote;
  document.getElementById('count-relocation').textContent = reloc;
  document.getElementById('count-contract').textContent = CONTRACTS.length;
  document.getElementById('count-boards').textContent = BOARDS.length;
}

function renderCards() {
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('job-count');
  updateTabCounts();

  if (activeTrack === 'contract') {
    renderContracts(grid, countEl);
    return;
  }
  if (activeTrack === 'boards') {
    renderBoards(grid, countEl);
    return;
  }

  var trackMode = activeTrack === 'relocation' ? 'onsite' : 'remote';

  let filtered = JOBS.filter(j => {
    if (j.work_mode !== trackMode) return false;
    if (!searchTerm) return true;
    const q = searchTerm.toLowerCase();
    return j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q);
  });

  if (sortMode === 'score') filtered.sort((a,b) => b.score - a.score);
  else if (sortMode === 'newest') filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else if (sortMode === 'company') filtered.sort((a,b) => a.company.localeCompare(b.company));

  countEl.textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">No jobs match your search.</div>';
    return;
  }

  grid.innerHTML = filtered.map((j, i) => {
    const tags = (j.tags || []).map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('');
    const aggPill = j.via_aggregator ? '<span class="agg-pill">via aggregator</span>' : '';
    const bd = j.breakdown || {};
    const chips = [
      ['Title', bd.title], ['Entry', bd.entry], ['Skills', bd.skills], ['Keywords', bd.keywords],
      ['Remote', bd.remote], ['Recency', bd.recency]
    ].filter(c => c[1] !== undefined).map(c => '<span class="breakdown-chip">' + c[0] + ' ' + c[1] + '</span>').join('');

    return '<div class="card">' +
      '<div class="card-top">' +
        '<div class="score-badge ' + (j.score >= 80 ? 'tier-high' : j.score >= 60 ? 'tier-mid' : 'tier-low') + '">' + j.score + '</div>' +
        '<div class="card-title">' + escapeHtml(j.title) + '</div>' +
      '</div>' +
      '<div class="card-company">' + escapeHtml(j.company) + aggPill + '</div>' +
      (tags ? '<div class="tag-row">' + tags + '</div>' : '') +
      '<div class="card-meta">' + escapeHtml(j.source) + ' &middot; ' + escapeHtml(j.relative_date) + '</div>' +
      '<div class="card-actions">' +
        '<a class="apply-btn" href="' + escapeHtml(j.url) + '" target="_blank" rel="noopener">Apply &rarr;</a>' +
        '<button class="expand-btn" onclick="toggleExpand(this)" aria-label="Expand">&or;</button>' +
      '</div>' +
      '<div class="card-expanded">' +
        '<div class="breakdown">' + chips + '</div>' +
        '<div class="desc-preview">' + escapeHtml(j.desc_preview) + '</div>' +
        '<a class="desc-link" href="' + escapeHtml(j.url) + '" target="_blank" rel="noopener">view full posting &rarr;</a>' +
        (function() {
          var pb = j.playbook || {};
          var ch = pb.channel || 'unknown';
          var pt = (pb.pitch_type || 'general').replace('_', ' ');
          var steps = (pb.steps || []).map(function(s, i) {
            return '<li data-n="' + (i+1) + '.">' + escapeHtml(s) + '</li>';
          }).join('');
          var msg = pb.message || '';
          return '<div class="playbook-box">' +
            '<div class="playbook-header"><h4>How to apply</h4>' +
            '<span class="channel-badge">' + escapeHtml(ch) + '</span>' +
            '<span class="pitch-badge">' + escapeHtml(pt) + '</span></div>' +
            '<ol class="playbook-steps">' + steps + '</ol>' +
            (msg ? '<div class="msg-box" id="msg-' + i + '">' + escapeHtml(msg) + '</div>' +
            '<button class="copy-btn" onclick="copyMsg(' + i + ')">Copy message</button>' : '') +
          '</div>';
        })() +
      '</div>' +
    '</div>';
  }).join('');
}

function renderContracts(grid, countEl) {
  var sorted = CONTRACTS.slice().sort(function(a,b) {
    var order = {'Tier 1': 0, 'Tier 2': 1, 'Tier 3 (later)': 2};
    return (order[a.tier]||9) - (order[b.tier]||9);
  });
  countEl.textContent = sorted.length;
  grid.innerHTML = sorted.map(function(c) {
    var tc = c.tier === 'Tier 1' ? 't1' : c.tier === 'Tier 2' ? 't2' : 't3';
    var usd = c.pays_usd ? 'USD ✓' : 'Non-USD';
    var steps = (c.setup_steps || []).map(function(s, i) {
      return '<li data-n="' + (i+1) + '.">' + escapeHtml(s) + '</li>';
    }).join('');
    return '<div class="card">' +
      '<div class="card-top" style="gap:12px">' +
        '<div class="card-title">' + escapeHtml(c.name) + '</div>' +
        '<span class="tier-badge ' + tc + '">' + escapeHtml(c.tier) + '</span>' +
      '</div>' +
      '<div class="contract-info">' + usd + ' · Egypt: ' + escapeHtml(c.egypt_eligible) +
        ' · First $: ' + escapeHtml(c.time_to_first_dollar) +
        ' · Effort: ' + escapeHtml(c.effort) + '</div>' +
      '<div class="contract-desc">' + escapeHtml(c.what_it_is) + '</div>' +
      '<ol class="contract-steps">' + steps + '</ol>' +
      '<div class="pitch-box">' + escapeHtml(c.pitch_angle) + '</div>' +
      '<div class="priority-note ' + tc + '">' + escapeHtml(c.priority_note) + '</div>' +
      '<div><a class="go-btn" href="' + escapeHtml(c.url) + '" target="_blank" rel="noopener">Go to ' + escapeHtml(c.name) + ' →</a></div>' +
    '</div>';
  }).join('');
}

function renderBoards(grid, countEl) {
  var prioOrder = {'high': 0, 'medium': 1, 'low': 2};
  var sorted = BOARDS.slice().sort(function(a,b) {
    return (prioOrder[a.priority]||9) - (prioOrder[b.priority]||9);
  });
  countEl.textContent = sorted.length;
  grid.innerHTML = sorted.map(function(b) {
    var r = b.region.toLowerCase();
    var rc = r.includes('egypt') ? 'egypt' : (r.includes('gulf') || r.includes('mena')) ? 'gulf' : 'global';
    return '<div class="card">' +
      '<div class="card-top" style="gap:12px">' +
        '<div class="card-title">' + escapeHtml(b.name) + '</div>' +
        '<span class="region-badge ' + rc + '">' + escapeHtml(b.region) + '</span>' +
      '</div>' +
      '<div class="board-desc">' + escapeHtml(b.what_it_is) + '</div>' +
      '<div class="search-tip-box">' + escapeHtml(b.search_tip) + '</div>' +
      '<div><a class="open-btn" href="' + escapeHtml(b.url) + '" target="_blank" rel="noopener">Open ' + escapeHtml(b.name) + ' search &rarr;</a></div>' +
    '</div>';
  }).join('');
}

function copyMsg(idx) {
  var el = document.getElementById('msg-' + idx);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(function() {
    var btn = el.nextElementSibling;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Copy message'; btn.classList.remove('copied'); }, 2000);
  });
}

function toggleExpand(btn) {
  btn.classList.toggle('open');
  const expanded = btn.closest('.card').querySelector('.card-expanded');
  expanded.classList.toggle('show');
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTrack = tab.dataset.track;
  renderCards();
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderCards();
});

document.getElementById('sort').addEventListener('change', e => {
  sortMode = e.target.value;
  renderCards();
});

renderCards();
</script>
</body>
</html>
